[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelineiq"
version = "0.1.0"
description = "A local-first data pipeline observability learning project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.0.5",
    "delta-spark==4.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]
monitoring = ["psycopg[binary]==3.3.9"]
api = ["psycopg[binary]==3.3.9", "fastapi==0.165.0", "pydantic==2.14.4", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
include = ["pipelines", "pipelines.*", "monitoring", "monitoring.*", "api", "api.*"]

[tool.setuptools.package-data]
monitoring = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: starts a real local Spark JVM and reads/writes Delta",
    "postgres: requires PIPELINEIQ_TEST_DATABASE_URL and a dedicated PostgreSQL test database",
]
